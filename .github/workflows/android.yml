name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Bez local.properties klucz TMDB jest pusty – aplikacja się buduje, a testy używają atrap.
      - name: Styl, testy i lint
        run: ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Raporty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
